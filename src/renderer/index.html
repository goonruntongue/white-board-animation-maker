<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- スマホ：ノッチ／ホームバー領域まで使い、ピンチでページ自体が拡大されないようにする（キャンバスのズームはアプリ側で行う） -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; worker-src 'self'; manifest-src 'self'; connect-src 'self' ws: data: blob:"
    />
    <meta name="theme-color" content="#2d3035" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WB Animator" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <title>Whiteboard Animation Maker</title>
    <!-- 起動中の表示（アプリ本体より先に出る。見た目はアプリの LCD・LED に合わせる） -->
    <style>
      html, body { margin: 0; height: 100%; background: #1d1f23; }
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        background: radial-gradient(120% 90% at 50% 0%, #2d3035 0%, #1a1c20 60%, #111214 100%);
        font-family: 'Cascadia Mono', 'Consolas', ui-monospace, monospace;
        color: #ffa53d;
        transition: opacity 0.4s ease;
      }
      #boot.boot-done { opacity: 0; pointer-events: none; }
      .boot-panel {
        width: min(340px, calc(100vw - 48px));
        padding: 18px 18px 16px;
        border-radius: 14px;
        background: linear-gradient(180deg, #34373d, #26282d);
        box-shadow: 0 0 0 1px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.07), 0 18px 40px rgba(0,0,0,0.55);
      }
      .boot-title {
        margin: 0 0 12px; font: 600 11px/1 system-ui, sans-serif; letter-spacing: 0.16em;
        color: #9aa0a8; text-transform: uppercase; text-shadow: 0 -1px 0 rgba(0,0,0,0.7);
      }
      .boot-lcd {
        position: relative; overflow: hidden;
        padding: 10px 12px 12px; border-radius: 9px;
        background: radial-gradient(120% 140% at 30% 0%, #2a1a0e 0%, #100a06 70%);
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.8), inset 0 0 18px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.06);
      }
      .boot-lcd::after {
        content: ''; position: absolute; inset: 0 0 55% 0; pointer-events: none;
        background: linear-gradient(180deg, rgba(255,255,255,0.07), transparent);
      }
      .boot-top { display: flex; justify-content: space-between; gap: 8px; font-size: 10px; letter-spacing: 0.08em; }
      .boot-label { opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .boot-state { text-shadow: 0 0 7px rgba(255,150,40,0.7); animation: boot-blink 1.1s steps(2, end) infinite; }
      .boot-digits { position: relative; margin-top: 2px; font-size: 34px; font-weight: 700; letter-spacing: 0.06em; line-height: 1.1; font-variant-numeric: tabular-nums; }
      .boot-ghost { color: rgba(255,165,61,0.08); }
      .boot-pct-wrap { position: absolute; left: 0; top: 0; text-shadow: 0 0 7px rgba(255,150,40,0.7), 0 0 18px rgba(255,120,30,0.35); }
      .boot-leds { display: flex; gap: 3px; margin-top: 10px; }
      .boot-led {
        flex: 1; height: 9px; border-radius: 2px;
        background: radial-gradient(circle at 40% 35%, #3a2a1c, #170e07);
        box-shadow: inset 0 1px 1px rgba(0,0,0,0.8);
        transition: background 0.15s, box-shadow 0.15s;
      }
      .boot-led.on {
        background: radial-gradient(circle at 40% 30%, #ffd2a0 0%, #ff8a2a 45%, #e75a12 100%);
        box-shadow: 0 0 6px rgba(255,122,46,0.85), 0 0 14px rgba(255,110,30,0.4), inset 0 1px 0 rgba(255,240,220,0.6);
      }
      .boot-led.head { animation: boot-pulse 0.6s ease-in-out infinite alternate; }
      @keyframes boot-pulse { from { filter: brightness(1); } to { filter: brightness(1.6); } }
      @keyframes boot-blink { 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) { .boot-led.head, .boot-state { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot" role="progressbar" aria-label="読み込み中" aria-valuemin="0" aria-valuemax="100">
      <div class="boot-panel">
        <p class="boot-title">Whiteboard Animation Maker</p>
        <div class="boot-lcd">
          <div class="boot-top"><span class="boot-label">本体を読み込み中</span><span class="boot-state">LOADING</span></div>
          <div class="boot-digits"><span class="boot-ghost">888%</span><span class="boot-pct-wrap"><span class="boot-pct">000</span>%</span></div>
          <div class="boot-leds">
            <i class="boot-led"></i><i class="boot-led"></i><i class="boot-led"></i><i class="boot-led"></i><i class="boot-led"></i>
            <i class="boot-led"></i><i class="boot-led"></i><i class="boot-led"></i><i class="boot-led"></i><i class="boot-led"></i>
            <i class="boot-led"></i><i class="boot-led"></i><i class="boot-led"></i><i class="boot-led"></i><i class="boot-led"></i>
            <i class="boot-led"></i><i class="boot-led"></i><i class="boot-led"></i><i class="boot-led"></i><i class="boot-led"></i>
          </div>
        </div>
      </div>
    </div>
    <script src="./boot-loader.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- ブラウザ版（PWA）の更新：デスクトップ版・開発中は何もしない -->
    <script src="./register-sw.js"></script>
  </body>
</html>
